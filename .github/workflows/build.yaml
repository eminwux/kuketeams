name: Binary CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test library and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: make test

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Identify checked-out source
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "version=dev-${sha:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build and verify distribution
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.source.outputs.version }}
        run: make dist GOOS=linux GOARCH="$TARGET_ARCH" VERSION="$VERSION"
      - name: Upload verified distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuketeams-linux-${{ matrix.arch }}-${{ steps.source.outputs.short_sha }}
          path: |
            bin/dist/linux-${{ matrix.arch }}/kuketeams-linux-${{ matrix.arch }}
            bin/dist/linux-${{ matrix.arch }}/kuketeams-linux-${{ matrix.arch }}.sha256
            bin/dist/linux-${{ matrix.arch }}/build-info.json
          if-no-files-found: error
          retention-days: 14
      - name: Download uploaded distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kuketeams-linux-${{ matrix.arch }}-${{ steps.source.outputs.short_sha }}
          path: ${{ runner.temp }}/downloaded-artifact
      - name: Verify downloaded distribution
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
        run: bash scripts/verify-artifact.sh "$RUNNER_TEMP/downloaded-artifact" "$TARGET_ARCH" "$BUILD_SHA" "$VERSION"

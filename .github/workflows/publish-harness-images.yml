name: publish-harness-images

on:
  push:
    tags:
      - "v[0-9]*"
  # Temporary review validation; remove after both architecture jobs pass.
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/eminwux/kuketeams
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  validate:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      PLATFORMS: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free space for the complete image set
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - run: make test-harnesses
      - name: Build all bases and harness variants for local smoke checks
        run: make -C harnesses images MODE=load

      - name: Smoke home, identity, state, SSH, and CLI startup
        run: make -C harnesses smoke

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release tag and catalog before publication
        run: ./harnesses/release-images.sh "$GITHUB_REF_NAME" --check
      - name: Free space for the complete image set
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - run: make test-harnesses
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish bases and leaves through the linked dependency graph
        env:
          TAG: ${{ github.ref_name }}
        run: make -C harnesses images MODE=push

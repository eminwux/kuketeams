name: publish-harness-images

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/eminwux/kuketeams
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  verify-source:
    name: Require a release tag on main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged commit belongs to main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tags must point to a commit already on main."
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify release tag and catalog
        run: ./harnesses/release-images.sh "$GITHUB_REF_NAME" --check

  binaries:
    needs: verify-source
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: verify-source
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check release tag and catalog before publication
        run: ./harnesses/release-images.sh "$GITHUB_REF_NAME" --check
      - name: Free space for the complete image set
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - run: make test-harnesses
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish bases and leaves through the linked dependency graph
        env:
          TAG: ${{ github.ref_name }}
        run: make -C harnesses images REGISTRY="$REGISTRY" TAG="$TAG" PLATFORMS="$PLATFORMS" MODE=push

  release:
    name: Publish GitHub Release
    needs: [verify-source, binaries, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kuketeams-linux-*
          path: ${{ runner.temp }}/release-downloads
      - name: Verify and stage release assets and summary
        env:
          DOWNLOADS: ${{ runner.temp }}/release-downloads
          OUTPUT: ${{ runner.temp }}/release
        run: bash scripts/prepare-release.sh "$DOWNLOADS" "$OUTPUT" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Create release with generated change notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTPUT: ${{ runner.temp }}/release
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$OUTPUT"/assets/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "$(cat "$OUTPUT/notes.md")" "${flags[@]}"

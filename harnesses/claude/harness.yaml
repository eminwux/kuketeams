apiVersion: kuketeams.io/v1
kind: Harness
metadata:
  name: claude
spec:
  skillPath: $HOME/.claude/skills
  makeTarget: claude
  template: blueprint.tmpl.yaml
  seeds:
    - path: ${TEAM_ROOT}/claude.json
      mode: 0o644
      content: |
        {
          "hasCompletedOnboarding": true,
          "installMethod": "native"
        }
  images:
    - name: claude
      build:
        context: harnesses/claude
        dockerfile: Dockerfile
      capabilities: [claude, git, gh, go, node, make]
    - name: claude-android
      build:
        context: harnesses/claude
        dockerfile: Dockerfile.android
      capabilities: [claude, git, gh, go, node, make, android]
    - name: claude-root
      build:
        context: harnesses/claude
        dockerfile: Dockerfile.root
      capabilities: [claude, git, gh, go, node, make, root]

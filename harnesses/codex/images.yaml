apiVersion: kuketeams.io/v1
kind: HarnessImageCatalog
metadata:
  name: codex
spec:
  images:
    - image: ghcr.io/eminwux/kuketeams/codex:v0.2.1
      capabilities:
        - codex
        - git
        - gh
        - go
        - node
        - make
    - image: ghcr.io/eminwux/kuketeams/codex-root:v0.2.1
      capabilities:
        - codex
        - git
        - gh
        - go
        - node
        - make
        - root

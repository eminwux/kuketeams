# Opencode-harness cell template, parameterized by the role (.role.name) and by the matching
# Role's spec.needs (skills, repos, mounts, params) and harnesses.opencode.{permissions, secrets}.
#
# Opencode CLI surface (cwd = the in-cell project dir /home/user/<NAME> for both paths):
#   non-interactive: opencode run "PROMPT" --model $OPENROUTER_MODEL ./
#   interactive:     opencode               --model $OPENROUTER_MODEL ./
#
# Opencode reads /home/user/.opencode-config (baked into the image;
# OPENCODE_CONFIG env points at it). That file references {env:OPENROUTER_API_KEY}
# and {env:OPENROUTER_MODEL}, both supplied from the cell env.
#
# Conventions match harnesses/claude/blueprint.tmpl.yaml — see that file's header
# for the substitution / iteration semantics. The renderer is shared.
apiVersion: v1beta1
kind: CellBlueprint
metadata:
  name: {{ .role.name }}-opencode
  realm: {{ .realm }}
  space: {{ .space }}
  stack: {{ .stack }}
{{- /*
  $isRoot / $home — root-aware rendering, identical mechanism to
  harnesses/claude/blueprint.tmpl.yaml: when the merged needs.image carries the
  `root` capability the renderer selected the opencode-root image (uid 0,
  $HOME=/home/user), so every in-cell path follows $home and the root-only knobs
  (privileged, nestedCgroupRuntime, tmpfs, /opt/cni) render. teamrender exposes
  only upper/replace, so membership is a range+eq scan. opencode's invocation is
  unchanged under root (it already skips permissions); only paths differ.
*/ -}}
{{- $isRoot := false }}
{{- range .needs.image }}{{- if eq . "root" }}{{- $isRoot = true }}{{- end }}{{- end }}
{{- $home := "/home/user" }}
spec:
  prefix: {{ .role.name }}-opencode
  parameters:
    - name: PROMPT
      description: "Prompt passed to `opencode run`; empty = interactive"
      default: ""
    - name: AGENT_NAME
      description: "Cell-side AGENT_NAME env (statusline + identity)"
      default: {{ .role.name }}-opencode
    - name: OPENROUTER_MODEL
      description: "OpenRouter model slug passed to opencode --model"
      default: "openrouter/qwen/qwen3.7-max"
    {{- range .needs.params }}
    {{- if not (or (eq . "PROMPT") (eq . "AGENT_NAME") (eq . "OPENROUTER_MODEL") (eq . "ANTHROPIC_MODEL")) }}
    - name: {{ . }}
      required: true
    {{- end }}
    {{- end }}
  cell:
    tty:
      default: work
    {{- if $isRoot }}
    # Root cells run docker/containerd-in-cell; the nested cgroup runtime
    # delegates a cgroup subtree so an inner runtime can manage its own scopes.
    nestedCgroupRuntime: true
    {{- end }}
    containers:
      - id: work
        attachable: true
        image: {{ .image }}
        command: /bin/bash
        workingDir: {{ $home }}
        {{- if $isRoot }}
        privileged: true
        {{- end }}
        env:
          - PROMPT=${PROMPT}
          - AGENT_NAME=${AGENT_NAME}
          {{- if .project.PROJECT_DIR }}
          # AGENTS_REPO targets /reflect's learn-feedback issues; project-bound
          # roles only (singleton meta-*/orchestrator cells have no .project, so
          # the guard leaves it unset rather than exporting an empty value).
          - AGENTS_REPO={{ .project.AGENTS_REPO }}
          {{- end }}
          - OPENCODE_CONFIG={{ $home }}/.opencode-config
          - OPENROUTER_MODEL=${OPENROUTER_MODEL}
          - AGENT_DEF_DIR={{ $home }}/agents/${ROLE}
          - SHARED_AGENT_DIR={{ $home }}/agents/common
          {{- if $isRoot }}
          # IS_SANDBOX is claude's uid-0 guard; carried uniformly across root
          # harness cells (inert for opencode, kept for parity with claude-root).
          - IS_SANDBOX=1
          {{- end }}
          # Root consumes a read-only SSH config owned by the host user.
          # An explicit -F preserves that config without SSH's implicit
          # per-user ownership check; /dev/null handles an absent config.
          # Explicit -F also skips /etc/ssh/ssh_config (see harnesses/README.md).
          - GIT_SSH_COMMAND=ssh{{ if $isRoot }} -F "$(if [ -f {{ $home }}/.ssh/config ]; then printf %s {{ $home }}/.ssh/config; else printf %s /dev/null; fi)"{{ end }} -i {{ $home }}/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ $home }}/.ssh/known_hosts
        secrets:
          {{- range .harnesses.opencode.secrets }}
          - name: {{ . }}
            envName: {{ . | upper | replace "-" "_" }}
          {{- end }}
        volumes:
          {{- range .needs.mounts }}
          - source: {{ if eq . "ssh" }}{{ $.operator.HOME_DIR }}/.ssh{{ else }}{{ template "mount_source" . }}{{ end }}
            target: {{ if eq . "ssh" }}{{ $home }}/.ssh{{ else }}{{ template "mount_target" . }}{{ end }}
            readOnly: {{ template "mount_readonly" . }}
          {{- end }}
          {{- if $isRoot }}
          # CNI plugin binaries + conflists for the in-cell runtime's networking
          # (matches the retired crew dev-root mount; the daemon's own /opt/cni
          # binds target the kukeond cell, not workload cells).
          - source: /opt/cni
            target: /opt/cni
          {{- end }}
        {{- if $isRoot }}
        # Host rootfs is an overlay on sandboxed dev hosts; docker/containerd
        # cannot stack their overlay drivers on a host bind — back with tmpfs.
        tmpfs:
          - path: /var/lib/docker
            sizeBytes: 4294967296
          - path: /var/lib/containerd
            sizeBytes: 4294967296
        {{- end }}
        git:
          author:
            name: {{ .operator.GIT_USER_NAME }}
            email: {{ .operator.GIT_USER_EMAIL }}
          committer:
            name: {{ .operator.GIT_USER_NAME }}
            email: {{ .operator.GIT_USER_EMAIL }}
          signingKey:     {{ $home }}/.ssh/id_ed25519.pub
          sign:           [commits, tags]
          allowedSigners: {{ $home }}/.ssh/allowed_signers
        repos:
          {{- range .needs.repos }}
          - name: {{ . }}
            url: {{ template "repo_url" . }}
            target: {{ $home }}/{{ if eq . "project" }}{{ $.project.NAME }}{{ else }}{{ template "repo_target" . }}{{ end }}
            branch: main
            required: true
          {{- end }}
        tty:
          prompt: "opencode> "
          onInit:
            - script: |
                make -C {{ $home }}/agents opencode-openrouter ROLE=${ROLE}
                cat > "$OPENCODE_CONFIG" <<'JSON'
                {
                  "$schema": "https://opencode.ai/config.json",
                  "model": "{env:OPENROUTER_MODEL}",
                  "provider": {
                    "openrouter": {
                      "models": {},
                      "options": { "apiKey": "{env:OPENROUTER_API_KEY}" }
                    }
                  },
                  "instructions": [
                    "{{ $home }}/agents/${ROLE}/CLAUDE.md"
                  ]
                }
                JSON
            - script: |
                {{- if .project.PROJECT_DIR }}
                cd {{ $home }}/{{ .project.NAME }}
                git checkout main
                git pull
                {{- end }}
                if [ -n "$PROMPT" ]; then
                  opencode run "$PROMPT" --dangerously-skip-permissions --model "$OPENROUTER_MODEL" -f ./
                else
                  opencode --model "$OPENROUTER_MODEL" ./
                fi
                exit $?

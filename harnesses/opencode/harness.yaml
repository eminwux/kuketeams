apiVersion: kuketeams.io/v1
kind: Harness
metadata:
  name: opencode
spec:
  skillPath: $HOME/.agents/skills
  makeTarget: opencode-openrouter
  template: blueprint.tmpl.yaml
  images:
    - name: opencode
      build:
        context: harnesses/opencode
        dockerfile: Dockerfile
      capabilities: [opencode, git, gh, go, node, make]
    - name: opencode-root
      build:
        context: harnesses/opencode
        dockerfile: Dockerfile.root
      capabilities: [opencode, git, gh, go, node, make, root]

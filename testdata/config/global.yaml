apiVersion: kuketeams.io/v1
kind: TeamsConfig
spec:
  git:
    author:
      name: Example User
      email: user@example.com
    committer:
      name: Example User
      email: user@example.com
    signingKey: /home/inwx/.ssh/id_rsa.pub
    sign:
      - commits
    allowedSigners: /home/inwx/.ssh/allowed_signers
  defaults:
    sources:
      - name: kuketeams
        url: github.com/eminwux/kuketeams
        branch: main
    roles:
      - name: operator
        source: kuketeams
        path: roles/operator
        needs:
          image: [go]
      - name: dev
        source: kuketeams
        path: roles/dev
        harness: claude
    harnesses:
      - name: codex
        source: kuketeams
        path: harnesses/codex
        default: true
      - name: claude
        source: kuketeams
        path: harnesses/claude
